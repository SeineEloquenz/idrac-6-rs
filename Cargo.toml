[package]
name = "idrac6-kvm"
version = "0.1.0"
edition = "2021"
description = "Modern KVM console proxy for Dell iDRAC 6 (APCP to RFB/VNC)"
license = "MIT"

[[bin]]
name = "idrac6-kvm"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
openssl = "0.10"
tokio-openssl = "0.6"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
opt-level = 3
lto = "thin"
