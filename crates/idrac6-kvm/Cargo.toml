[package]
name = "idrac6-kvm"
version = "0.1.0"
edition = "2021"
description = "iDRAC 6 KVM proxy core: live session supervisor and RFB/VNC server"

[dependencies]
idrac6-proto = { path = "../idrac6-proto" }
idrac6-video = { path = "../idrac6-video" }
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync", "time", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1"
